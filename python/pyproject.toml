[project]
name = "fortunes-platform"
version = "0.9.0"
description = "The server code the Little Fortunes apps share"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "authlib>=1.3",       # OIDC relying party (auth.mode: oidc)
    "itsdangerous>=2.1",  # starlette SessionMiddleware (OIDC handshake state)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortunes_platform"]
