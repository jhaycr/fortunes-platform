[project]
name = "fortunes-platform"
version = "0.10.0"
description = "The server code the Little Fortunes apps share"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "cryptography>=42.0",
    "authlib>=1.3",       # OIDC relying party (auth.mode: oidc)
    "itsdangerous>=2.1",  # starlette SessionMiddleware (OIDC handshake state)
    "python-multipart>=0.0.9",  # a library's PDF upload (books.receive)
    "pypdfium2>=4",       # a library's import: a PDF's text, and pages rendered (pdfimport)
    "pillow>=10.0",       # pages rendered as images (pdfimport)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fortunes_platform"]
